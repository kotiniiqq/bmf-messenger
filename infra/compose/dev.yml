# Local development stack. Production compose lives in compose/prod.yml and
# additionally runs Caddy, Stalwart, LiveKit and coturn.
name: bmf-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bmf
      POSTGRES_PASSWORD: bmf
      POSTGRES_DB: bmf
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bmf']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bmfminio
      MINIO_ROOT_PASSWORD: bmfminio-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

volumes:
  pgdata:
  redisdata:
  miniodata:
