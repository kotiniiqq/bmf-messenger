# coturn for the beta host. The shared secret and the public address are passed
# on the command line from .env.beta (see beta.yml) — nothing secret lives here.

listening-port=3478
fingerprint

# Time-limited credentials: our API signs a username/password pair valid for a few
# minutes when a call starts. No account on this server ever outlives a call.
lt-cred-mech
use-auth-secret
realm=bmf.ink

# Matches the published range in beta.yml. Narrow on purpose: a beta that peaks at
# five concurrent calls does not need coturn's default sixteen thousand ports.
min-port=49160
max-port=49200

# An open relay is somebody else's proxy within a day. Peers on private ranges are
# refused so this cannot be pointed back at the host's own network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Enough for the beta's ceiling; keeps one client from taking the whole relay.
user-quota=12
total-quota=120
